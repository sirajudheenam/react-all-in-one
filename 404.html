<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>React All-in-One</title>
  <script>
    // GitHub Pages SPA redirect: encode the path into a query string and
    // redirect to index.html, which will restore it via history.replaceState.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 2).join('/') +
      '/?p=' + encodeURIComponent(l.pathname.slice(1) + (l.search ? l.search : '') + l.hash)
    );
  </script>
</head>
<body></body>
</html>
